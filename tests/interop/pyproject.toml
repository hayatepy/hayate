[project]
name = "hayate-asgi-interop-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "django==6.0.7",
  "fastapi==0.140.0",
  "hayate",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
]

[tool.uv.sources]
hayate = { path = "../..", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
